services:
  db:
    image: postgres:16-alpine
    container_name: formula-k-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: payload
      POSTGRES_DB: formula_k
    ports:
      - '5432:5432'
    volumes:
      - formula_k_db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payload -d formula_k']
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  formula_k_db:
